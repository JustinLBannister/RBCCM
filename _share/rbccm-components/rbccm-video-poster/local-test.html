<title>rbccm-video-poster - local test</title>
<!-- Bootstrap 3 stands in for the site's modal plugin. The component JS
     also works with Bootstrap 5 or with no Bootstrap at all. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<link rel="stylesheet" href="rbccm-video-poster.css">
<script src="../rbccm-animate/rbccm-animate.js"></script>
<style>
  body { margin: 0; background: #fff; font-family: Roboto, Arial, sans-serif; }
  .demo-note { max-width: 1140px; margin: 0 auto; padding: 16px 23px; font: 13px/1.5 Roboto, Arial, sans-serif; color: #555; }
  .demo-note code { background: #eef; padding: 1px 5px; border-radius: 3px; }
  /* Stand-ins for the MAAS+MATA hero above and dark strip below, so
     the space-above and the 200px overlap are visible. */
  .demo-hero { background: linear-gradient(180deg, #002144 0%, #061730 100%); color: #fff; text-align: center; padding: 80px 23px 0; }
  .demo-hero h1 { margin: 0; font: 400 40px/1.2 Georgia, serif; }
  /* On MAAS+MATA the page wrapper is navy, so the 75px above the
     image is navy too. */
  .demo-page { background: #061730; }
  .demo-strip { background: #051B38; color: #D8D8D8; text-align: center; padding: 260px 23px 80px; }
  .demo-plain { background: #F3F4F5; padding: 40px 0; }
</style>
</head>
<body data-picker-title="rbccm-video-poster">

<div class="demo-note" data-variant="With video (MAAS+MATA)">
  Poster + play button + Brightcove modal. <code>SpaceAbove</code> 75, <code>OverlapBelow</code> 200: the dark strip slides up under the image.
</div>
<div class="demo-page">
<div class="demo-hero">
  <h1>Hero stand-in</h1>
</div>

screen="allowfullscreen" allow="autoplay; fullscreen" frameborder="0" title="MAAS + MATA platform overview video" data-src="https://players.brightcove.net/6021289101001/VyvCc9BZx_default/index.html?videoId=6385114247112"></iframe></div></div><span class="rbccm-video-poster__focus-guard" tabindex="0" aria-hidden="true"></span></div></div></div></div></div>

<div class="demo-strip">Next section (dark strip stand-in). It starts 200px up, underneath the image.</div>
</div>

</div>
<div class="demo-plain">
<div class="rbccm-video-poster" data-hero-rise="rise" data-animate-delay="600" id="rbccm-video-poster-2" style="--rbccm-vp-space-above: 40px; --rbccm-vp-overlap: 0px;"><img class="rbccm-video-poster__image" width="1100" height="366" fetchpriority="high" src="../maas-mata-page/maas-execution-console-reveal.png" alt="MAAS Execution Console dashboard preview showing a portfolio chart, three instrument rows (Holly Inc., CAD/USD, Ardy Dec 26), and an Execution quality score of 98.2."></div>
