        var c = compById(id);
        return c ? '<a class="dash-chip dash-chip--small" href="#/c/' + encodeURIComponent(id) + '">' + esc(c.title) + '</a>'
          : '<span class="dash-chip dash-chip--small">' + esc(id) + '</span>';
      }).join('');
      return '<article class="dash-card"><div class="dash-card__body">' +
        '<h3 class="dash-card__title">' + esc(p.label) + '</h3><span class="dash-card__id">' + esc(p.name) + '</span>' +
        '<div class="dash-card__chips"><span class="dash-chip dash-chip--small' + (p.live ? ' dash-chip--live' : '') + '">' + (p.live ? 'Live' : 'In progress') + '</span>' +
        '<span class="dash-chip dash-chip--small">' + p.components.length + ' components</span></div>' +
        '<div class="dash-header__row"><a class="dash-btn" href="' + esc(p.preview) + '" target="_blank" rel="noopener">Build preview ' + icon('i-open') + '</a>' +
        (p.url ? '<a class="dash-btn dash-btn--tonal" href="' + esc(p.url) + '" target="_blank" rel="noopener">Live page ' + icon('i-open') + '</a>' : '') + '</div>' +
        '<div class="dash-card__chips">' + comps + '</div></div></article>';
    }).join('') + '</div></section>';
    if (!pages.length) html += '<p class="dash-empty">No pages match the search.</p>';
    html += '<section class="dash-section"><h2>Tools</h2><ul class="dash-list">' +
      DATA.tools.map(function (t) {
        return '<li><span class="dash-list__name">' + esc(t.title) + '</span><span class="dash-list__links"><a class="dash-chip dash-chip--small" href="' + esc(t.href) + '" target="_blank" rel="noopener">Open</a></span></li>';
      }).join('') +
      '<li><span class="dash-list__name">Component inventory: which pages use which components</span><span class="dash-list__links"><a class="dash-chip dash-chip--small" href="' + esc(DATA.inventory) + '" target="_blank" rel="noopener">Open</a></span></li>' +
      '</ul><p class="dash-foot" style="margin:16px 0 0">Build previews and the inventory are written by <code>npm run build</code>. If a link opens a missing page, run the build first.</p></section>';
    view.innerHTML = html;
  }

  /* ---------- Earlier work view ---------- */
  function renderEarlier() {
    var items = DATA.earlier.filter(function (e) { return matches(e.id + ' ' + e.title + ' ' + e.html.join(' ')); });
    var html = '<header class="dash-header"><p class="dash-header__eyebrow">RBC Capital Markets</p><h1>Earlier work</h1>' +
      '<p>Component and page work from before the rbccm- naming. These folders are kept for reference; they are not part of the page builds.</p>' +
      '<div class="dash-header__row"><span class="dash-chip dash-chip--tonal">' + DATA.earlier.length + ' folders</span></div></header>';
    html += items.length ? '<section class="dash-section"><ul class="dash-list">' + items.map(function (e) {
      var links = e.html.slice(0, 8).map(function (f) {
        return '<a class="dash-chip dash-chip--small" href="' + esc(e.id + '/' + f) + '" target="_blank" rel="noopener">' + esc(f) + '</a>';
      }).join('');
      if (e.html.length > 8) links += '<span class="dash-chip dash-chip--small">+' + (e.html.length - 8) + ' more</span>';
      if (!e.html.length) links = '<span class="dash-chip dash-chip--small">No preview page</span>';
      return '<li><span class="dash-list__name">' + esc(e.title) + '<br><span class="dash-card__id">' + esc(e.id) + '/ - ' + e.count + ' items</span></span>' +
        '<span class="dash-list__links">' + links + '</span></li>';
    }).join('') + '</ul></section>' : '<p class="dash-empty">No folders match the search.</p>';
    view.innerHTML = html;
  }

  /* ---------- Component detail ---------- */
  function renderDetail(id, tab) {
    var c = compById(id);
    if (!c) { location.hash = '#/'; return; }
    var tabs = [];
    if (c.preview) tabs.push(['preview', 'Preview']);
    if (c.readme) tabs.push(['requirements', c.ba ? 'Requirements' : 'Readme']);
    tabs.push(['files', 'Files and paths']);
    if (!tabs.some(function (t) { return t[0] === tab; })) tab = tabs[0][0];
    var html = '<a class="dash-btn dash-btn--text dash-back" href="#/">' + icon('i-back') + 'All components</a>' +
      '<header class="dash-header"><p class="dash-header__eyebrow">' + esc(c.category) + '</p><h1>' + esc(c.title) + '</h1>' + (c.desc ? '<p>' + esc(c.desc) + '</p>' : '') +
      '<div class="dash-header__row">' + pageChips(c, false) + '</div>' +
      '<div class="dash-header__row">' +
      (c.preview ? '<a class="dash-btn" href="' + esc(c.preview) + '" target="_blank" rel="noopener">Open preview ' + icon('i-open') + '</a>' : '') +
      (c.readme ? '<a class="dash-btn dash-btn--tonal" href="' + esc(c.readme) + '" target="_blank" rel="noopener">README file ' + icon('i-open') + '</a>' : '') +
      '</div></header>' +
      '<div class="dash-tabs" role="tablist" aria-label="' + esc(c.title) + '">' + tabs.map(function (t) {
        return '<button type="button" class="dash-tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + '</button>';
      }).join('') + '</div><div class="dash-panel" role="tabpanel" id="panel"></div>';
    view.innerHTML = html;
    var panel = document.getElementById('panel');
    if (tab === 'preview') previewPanel(c, panel);
    else if (tab === 'requirements') readmePanel(c, panel);
    else filesPanel(c, panel);
  }

  function previewPanel(c, panel) {
    var segs = Object.keys(WIDTHS).map(function (k) {
      return '<button type="button" data-width="' + k + '" aria-pressed="' + (state.width === k) + '">' + WIDTHS[k][0] + '</button>';
    }).join('');
    var select = c.variants.length > 1
      ? '<label><span class="dash-sr">Variant</span><select class="dash-select" id="variantSelect">' + c.variants.map(function (v) {
        return '<option value="' + esc(v.slug) + '">' + esc(v.name) + '</option>';
      }).join('') + '<option value="all">Show all variants</option></select></label>' : '';
    panel.innerHTML = '<div class="dash-toolbar"><div class="dash-seg" role="group" aria-label="Preview width">' + segs + '</div>' + select + '</div>' +
      '<div class="dash-stage"><div class="dash-stage__frame" id="frameWrap" style="width:' + WIDTHS[state.width][1] + '">' +
      '<iframe id="frame" title="' + esc(c.title) + ' preview"></iframe></div></div>';
    var frame = document.getElementById('frame');
    function load(slug) {
      /* The preview reads its variant on load, so give it a fresh URL each time. */
      state.frameSeq += 1;
      var url = c.preview + '?dash=' + state.frameSeq;
      var v = slug || (c.variants[0] && c.variants[0].slug) || '';
      frame.src = url + (v ? '#variant=' + encodeURIComponent(v) : '');
    }
    load('');
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('[data-width]');
      if (!b) return;
      state.width = b.getAttribute('data-width');
      [].forEach.call(panel.querySelectorAll('[data-width]'), function (x) { x.setAttribute('aria-pressed', x === b); });
      document.getElementById('frameWrap').style.width = WIDTHS[state.width][1];
    });
    var sel = document.getElementById('variantSelect');
    if (sel) sel.addEventListener('change', function () { load(sel.value); });
  }

  function readmePanel(c, panel) {
    panel.innerHTML = '<p class="dash-foot" style="margin:0">Loading...</p>';
    fetch(c.readme).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (text) {
      var base = c.id + '/';
      var block = '';
      var start = text.indexOf('## For editors and BAs');
      if (start !== -1) {
        var rest = text.slice(start);
        var next = rest.slice(5).search(/^## /m);
        block = next === -1 ? rest : rest.slice(0, next + 5);
        block = block.replace(/\n---\s*$/, '\n');
      }
      var html = '';
      if (block) {
        html += '<div class="dash-prose">' + md(block, base) + '</div>' +
          '<h2 class="dash-sub" style="margin-top:48px">Full README</h2>';
      }
      html += '<div class="dash-prose">' + md(block ? text.replace(block.replace(/\s+$/, ''), '') : text, base) + '</div>';
      panel.innerHTML = html;
    }).catch(function () {
      panel.innerHTML = '<p class="dash-empty" style="margin:0">The README could not be loaded here. <a href="' + esc(c.readme) + '" target="_blank" rel="noopener">Open the file</a>.</p>';
    });
  }

  function filesPanel(c, panel) {
    var rows = [];
    var T = DATA.teamsite;
    if (c.css) rows.push(['CSS', T.css + '/' + c.css]);
    if (c.js) rows.push(['JS', T.js + '/' + c.js]);
    if (c.hasSkin) rows.push(['Component', T.component]);
    if (c.css) rows.push(['On the site: CSS', '/assets/rbccm/css/components/' + c.css]);
    if (c.js) rows.push(['On the site: JS', '/assets/rbccm/js/components/' + c.js]);
    var html = '<h2 class="dash-sub" style="margin-top:0">Files in ' + esc(c.id) + '/</h2><ul class="dash-list">' + c.files.map(function (f) {
      var href = c.id + '/' + f.name;
      return '<li><span class="dash-list__name dash-mono">' + (f.kind === 'Folder' ? esc(f.name) : '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a>') +
        '</span><span class="dash-chip dash-chip--small">' + esc(f.kind) + '</span></li>';
    }).join('') + '</ul>';
    if (rows.length) {
      html += '<h2 class="dash-sub">TeamSite locations</h2><table class="dash-paths">' + rows.map(function (r) {
        return '<tr><th scope="row">' + esc(r[0]) + '</th><td class="dash-mono">' + esc(r[1]) + '</td>' +
          '<td style="width:56px"><button type="button" class="dash-round" data-copy="' + esc(r[1]) + '" aria-label="Copy the ' + esc(r[0]) + ' path" title="Copy">' + icon('i-copy') + '</button></td></tr>';
      }).join('') + '</table>';
    }
    panel.innerHTML = html;
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('[data-copy]');
      if (!b) return;
      var text = b.getAttribute('data-copy');
      var done = function () { b.setAttribute('aria-pressed', 'true'); setTimeout(function () { b.removeAttribute('aria-pressed'); }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () {});
      else { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (err) { /* no clipboard */ } t.remove(); }
    });
  }

  /* ---------- Small Markdown renderer (README files) ---------- */
  function mdInline(s, base) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, text, url) {
      var ext = /^(https?:|mailto:)/.test(url);
      if (!ext && url.charAt(0) !== '#' && url.charAt(0) !== '/') url = base + url;
      return '<a href="' + url + '"' + (ext || url.charAt(0) !== '#' ? ' target="_blank" rel="noopener"' : '') + '>' + text + '</a>';
    });
    return s;
  }
  function md(text, base) {
    var lines = text.replace(/\r\n?/g, '\n').split('\n');
    var out = [];
    var i = 0;
    function cells(line) { return line.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); }
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }
      if (/^```/.test(line)) {
        var code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++;
        out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
        continue;
      }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push('<h' + h[1].length + '>' + mdInline(h[2], base) + '</h' + h[1].length + '>'); i++; continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
        var head = cells(line);
        i += 2;
        var body = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
        out.push('<div class="dash-tablewrap"><table><thead><tr>' + head.map(function (c) { return '<th>' + mdInline(c, base) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + body.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + mdInline(c, base) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>');
        continue;
      }
      if (/^\s*>/.test(line)) {
        var quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ''));
        out.push('<blockquote>' + mdInline(quote.join(' '), base) + '</blockquote>');
        continue;
      }
      var li = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if (li) {
        var stack = [];
        var html = '';
        while (i < lines.length) {
          var m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          if (!m) {
            if (/^\s+\S/.test(lines[i]) && stack.length) { html += ' ' + mdInline(lines[i].trim(), base); i++; continue; }
            break;
          }
          var depth = m[1].length;
          var tag = /\d/.test(m[2]) ? 'ol' : 'ul';
          while (stack.length && depth < stack[stack.length - 1].depth) { html += '</li></' + stack.pop().tag + '>'; }
          if (!stack.length || depth > stack[stack.length - 1].depth) { stack.push({ depth: depth, tag: tag }); html += '<' + tag + '><li>'; }
          else { html += '</li><li>'; }
          html += mdInline(m[3], base);
          i++;
        }
        while (stack.length) html += '</li></' + stack.pop().tag + '>';
        out.push(html);
        continue;
      }
      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|```|\s*\||\s*>|\s*([-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++].trim());
      if (para.length) out.push('<p>' + mdInline(para.join(' '), base) + '</p>');
      else i++;
    }
    return out.join('\n');
  }

  /* ---------- Routing ---------- */
  function route() {
    var parts = (location.hash.replace(/^#\/?/, '') || '').split('/');
    var name = parts[0] || 'components';
    var current = name === 'c' ? 'components' : name;
    [].forEach.call(document.querySelectorAll('.dash-rail__item'), function (a) {
      if (a.getAttribute('data-view') === current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (thumbIO) thumbIO.disconnect();
    if (name === 'c') renderDetail(decodeURIComponent(parts[1] || ''), parts[2] || '');
    else if (name === 'pages') renderPages();
    else if (name === 'earlier') renderEarlier();
    else renderComponents();
    document.title = (name === 'c' && compById(decodeURIComponent(parts[1] || '')) ? compById(decodeURIComponent(parts[1])).title + ' - ' : '') + 'RBCCM Components';
  }
  var lastHash = null;
  window.addEventListener('hashchange', function () {
    var base = location.hash.split('/').slice(0, 3).join('/');
    if (base !== lastHash) window.scrollTo(0, 0);
    lastHash = base;
    route();
  });

  view.addEventListener('click', function (e) {
    var f = e.target.closest('[data-filter]');
    if (f) { state.filter = f.getAttribute('data-filter'); renderComponents(); return; }
    var t = e.target.closest('[data-tab]');
    if (t) {
      var parts = location.hash.replace(/^#\/?/, '').split('/');
      history.replaceState(null, '', '#/c/' + parts[1] + '/' + t.getAttribute('data-tab'));
      route();
    }
  });

  searchEl.addEventListener('input', function () {
    state.q = searchEl.value.trim();
    if (/^#\/c\//.test(location.hash)) { location.hash = '#/'; return; }
    route();
  });
  document.getElementById('railSearch').addEventListener('click', function () { searchEl.focus(); searchEl.scrollIntoView({ block: 'center' }); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); searchEl.focus(); }
    if (e.key === 'Escape' && document.activeElement === searchEl && searchEl.value) { searchEl.value = ''; state.q = ''; route(); }
  });

  /* ---------- Toggles ---------- */
  var thumbBtn = document.getElementById('thumbToggle');
  if (store('thumbs') === 'off') state.thumbs = false;
  thumbBtn.setAttribute('aria-pressed', state.thumbs);
  thumbBtn.addEventListener('click', function () {
    state.thumbs = !state.thumbs;
    thumbBtn.setAttribute('aria-pressed', state.thumbs);
    store('thumbs', state.thumbs ? 'on' : 'off');
    route();
  });
  var root = document.documentElement;
  var themeIcon = document.getElementById('themeIcon');
  function isDark() {
    var t = root.getAttribute('data-theme');
    return t ? t === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function paintTheme() { themeIcon.setAttribute('href', isDark() ? '#i-sun' : '#i-moon'); }
  var saved = store('theme');
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  paintTheme();
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    store('theme', next);
    paintTheme();
  });

  if (location.protocol === 'file:') document.getElementById('fileNotice').hidden = false;
  document.getElementById('foot').textContent = 'List generated ' + new Date(DATA.generated).toLocaleString() +
    '. Run "npm run dashboard" after adding a component, a variant or a page.';
  lastHash = location.hash.split('/').slice(0, 3).join('/');
  route();
}());
</script>
</body>
